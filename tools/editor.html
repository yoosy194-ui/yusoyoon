<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yu So Yoon — 로컬 관리</title><style>body{font:14px system-ui;background:#f6f4ef;color:#242822;max-width:900px;margin:40px auto;padding:0 24px}h1{font-size:32px}p{line-height:1.8;color:#67705e}label{display:block;margin:18px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd0c2;background:white;font:inherit}textarea{min-height:90px}button{background:#242822;color:white;border:0;padding:12px 18px;cursor:pointer;margin:8px 5px 8px 0}button.secondary{background:#e7633e}fieldset{border:1px solid #ccd0c2;margin-top:25px;padding:20px}.row{border-top:1px solid #ddd;padding:15px 0}#status{position:sticky;bottom:10px;background:#e1e6d5;padding:12px;display:none}.hint{font-size:12px}a{color:#b74728}</style><h1>Yu So Yoon / 로컬 관리</h1><p>이 파일은 본인 컴퓨터에서만 사용하세요. 수정 후 <b>배포용 HTML 다운로드</b>로 저장한 파일만 호스팅하면 방문자에게는 편집·저장 기능이 제공되지 않습니다. 서버의 원본 파일을 수정할 수 있는 API는 없습니다.</p><p class="hint">초안은 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우기 전에 JSON 백업을 다운로드하세요. 프로필·작업 이미지는 파일 안에 포함됩니다.</p><div id="app"></div><fieldset><legend>작업</legend><button id="save">이 브라우저에 초안 저장</button><button id="export" class="secondary">배포용 HTML 다운로드</button><button id="backup">JSON 백업</button><label>백업 불러오기<input type="file" id="restore" accept="application/json"></label><label>공개 페이지 원본 선택 (직접 파일로 열었을 때)<input type="file" id="template" accept=".html"></label><p class="hint">선택하는 원본은 함께 제공된 index.html이어야 합니다. editor.html과 JSON 백업은 배포하지 마세요.</p></fieldset><div id="status" role="status"></div><script>
let d,source='';const $=s=>document.querySelector(s);function status(t){$('#status').textContent=t;$('#status').style.display='block'}const names={name:'이름',englishName:'영문 이름',intro:'첫 화면 소개',bio:'자기소개',phone:'전화번호',email:'이메일',school:'학교',major:'전공',skills:'능력 / 기술 (쉼표로 구분)',company:'직장명',role:'직책 / 역할',period:'재직 기간',description:'설명 / 담당 업무 / 성과',title:'작업명',category:'분류',year:'제작 연도'};function field(parent,key,obj){let l=document.createElement('label');l.textContent=names[key];let input=document.createElement(['bio','intro','description'].includes(key)?'textarea':'input');input.value=key==='skills'?obj[key].join(', '):obj[key]||'';input.oninput=()=>obj[key]=key==='skills'?input.value.split(',').map(s=>s.trim()).filter(Boolean):input.value;l.append(input);parent.append(l)}function photo(parent,key,obj,title){let l=document.createElement('label');l.textContent=title;let f=document.createElement('input');f.type='file';f.accept='image/png,image/jpeg,image/webp';f.onchange=()=>{const file=f.files[0];if(!file)return;if(file.size>5*1024*1024){status('이미지는 5MB 이하로 선택해 주세요.');return}const reader=new FileReader();reader.onload=()=>{obj[key]=reader.result;status('이미지 적용 완료. 초안을 저장하거나 HTML을 다운로드하세요.')};reader.readAsDataURL(file)};l.append(f);parent.append(l);let b=document.createElement('button');b.textContent='이미지 제거';b.onclick=()=>{obj[key]='';status('이미지를 제거했습니다.')};parent.append(b)}function draw(){const root=$('#app');root.replaceChildren();let basic=document.createElement('fieldset');basic.innerHTML='<legend>기본 정보</legend>';root.append(basic);['name','englishName','intro','bio','phone','email','school','major','skills'].forEach(k=>field(basic,k,d));photo(basic,'photo',d,'프로필 사진');for(const [key,title,keys]of [['careers','직장 / 경력',['company','role','period','description']],['works','작업물 갤러리',['title','category','year','company','description']]]){let section=document.createElement('fieldset');section.innerHTML='<legend>'+title+'</legend>';root.append(section);d[key].forEach((obj,i)=>{let row=document.createElement('div');row.className='row';section.append(row);keys.forEach(k=>field(row,k,obj));if(key==='works'){photo(row,'image',obj,'작업 이미지');let label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=!!obj.demo;check.style.width='auto';check.onchange=()=>obj.demo=check.checked;label.append(check,' 예시 작업물 표시');row.append(label)}let remove=document.createElement('button');remove.textContent='삭제';remove.onclick=()=>{d[key].splice(i,1);draw()};row.append(remove)});let add=document.createElement('button');add.textContent=title+' 추가';add.onclick=()=>{d[key].push(key==='works'?{title:'새 작업',category:'Personal',year:String(new Date().getFullYear()),description:'',image:'',demo:false}:{company:'',role:'',period:'',description:''});draw()};section.append(add)}}
function load(html){source=html;const doc=new DOMParser().parseFromString(html,'text/html');const node=doc.querySelector('#portfolio-data');if(!node)throw Error('함께 제공된 index.html을 선택하세요.');d=JSON.parse(node.textContent);const saved=localStorage.getItem('ysy-draft-v1');if(saved){try{d=JSON.parse(saved)}catch{}}draw()}function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('#template').onchange=async()=>{try{load(await $('#template').files[0].text());status('원본을 불러왔습니다.')}catch(e){status(e.message)}};$('#save').onclick=()=>{if(!d)return status('먼저 index.html 원본을 불러오세요.');try{localStorage.setItem('ysy-draft-v1',JSON.stringify(d));status('이 브라우저에 초안을 저장했습니다. 공개 페이지에는 HTML 다운로드 후 반영됩니다.')}catch{status('저장 공간이 부족합니다. JSON 백업을 다운로드하세요.')}};$('#backup').onclick=()=>d?download('yu-so-yoon-backup.json',JSON.stringify(d,null,2),'application/json'):status('원본을 불러오세요.');$('#restore').onchange=async()=>{try{let next=JSON.parse(await $('#restore').files[0].text());if(!Array.isArray(next.works)||!Array.isArray(next.careers)||!Array.isArray(next.skills))throw Error();d=next;draw();status('백업을 불러왔습니다.')}catch{status('올바른 포트폴리오 JSON 백업을 선택하세요.')}};$('#export').onclick=()=>{if(!source||!d)return status('먼저 index.html 원본을 선택하세요.');let doc=new DOMParser().parseFromString(source,'text/html');doc.querySelector('#portfolio-data').textContent=JSON.stringify(d).replace(/</g,'\\u003c');doc.title=d.englishName+' — Portfolio';download('index.html','<!doctype html>\n'+doc.documentElement.outerHTML,'text/html');status('배포용 index.html을 다운로드했습니다. 이 파일만 공개 호스팅에 업로드하세요.')};fetch('./index.html').then(r=>{if(!r.ok)throw Error();return r.text()}).then(load).catch(()=>status('직접 파일로 열었다면 아래에서 함께 제공된 index.html 원본을 선택하세요.'));
</script></html>
